<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #040914;
  --cyan-neon: #00f2fe;
  --cyan-glow: #4facfe;
  --line-mut: rgba(140, 210, 255, 0.22);
  --mut: #94a5c4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #040914 !important;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  user-select: none;
}

.update-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at top, #091a38 0%, var(--bg-dark) 100%);
  border: 2px solid var(--cyan-neon);
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px 20px;
  box-shadow: 
    inset 0 0 20px rgba(0, 242, 254, 0.5),
    inset 0 0 40px rgba(0, 242, 254, 0.25);
}

#updateBgfx {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(75px);
  z-index: 1;
  pointer-events: none;
}
.g1 {
  width: 200px; height: 200px; left: -40px; top: -50px;
  background: radial-gradient(circle, rgba(0,242,254,0.3), transparent 70%);
  animation: drift1 14s ease-in-out infinite alternate;
}
.g2 {
  width: 220px; height: 220px; right: -50px; bottom: -50px;
  background: radial-gradient(circle, rgba(79,172,254,0.25), transparent 70%);
  animation: drift2 16s ease-in-out infinite alternate-reverse;
}
@keyframes drift1 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px, 20px) scale(1.15); } }
@keyframes drift2 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-30px, -20px) scale(1.1); } }

.content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}

h2 {
  font-family: 'Unbounded', 'Inter', sans-serif;
  font-weight: 900;
  font-size: 15px;
  letter-spacing: .06em;
  background: linear-gradient(135deg, #ffffff 0%, var(--cyan-neon) 60%, var(--cyan-glow) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
}

.update-btns {
  display: flex;
  align-items: center;
  gap: 14px;
}

.rpill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  font-weight: 700;
  padding: 8px 22px;
  border-radius: 99px;
  border: 1px solid var(--line-mut);
  transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
  backdrop-filter: blur(10px);
  outline: none;
}
.rpill:hover {
  transform: scale(1.06) translateY(-2px);
}

.btn-later {
  background: rgba(12, 22, 38, 0.85);
  color: var(--mut);
}
.btn-later:hover {
  background: rgba(25, 42, 70, 0.95);
  color: #fff;
  border-color: rgba(140, 210, 255, 0.5);
}

.btn-apply {
  border: 1.5px solid var(--cyan-neon);
  background: rgba(0, 242, 254, 0.24);
  box-shadow: 0 0 16px rgba(0, 242, 254, 0.5), inset 0 0 8px rgba(0, 242, 254, 0.3);
  color: #fff;
}
.btn-apply:hover {
  background: rgba(0, 242, 254, 0.4);
  box-shadow: 0 0 26px rgba(0, 242, 254, 0.8), inset 0 0 12px rgba(0, 242, 254, 0.5);
}
</style>
</head>
<body>

<div class="update-container">
  <canvas id="updateBgfx"></canvas>
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div class="content">
    <h2>ВОЛНА • ОБНОВЛЕНИЕ ГОТОВО</h2>
    <div class="update-btns">
      <button class="rpill btn-apply" onclick="callPy('py_apply_update')">✨ Установить сейчас</button>
      <button class="rpill btn-later" onclick="callPy('py_dismiss_update')">Позже</button>
    </div>
  </div>
</div>

<script>
function callPy(fn, ...args) {
  if (window.pywebview && window.pywebview.api && window.pywebview.api[fn]) {
    window.pywebview.api[fn](...args);
  }
}

const cv = document.getElementById('updateBgfx'), cx = cv.getContext('2d');
let W = 430, H = 160, parts = [], T = 0;

function resize() {
  W = cv.width = window.innerWidth || 430;
  H = cv.height = window.innerHeight || 160;
}
resize();
window.addEventListener('resize', resize);

for (let i = 0; i < 35; i++) {
  parts.push({
    x: Math.random() * 430,
    y: Math.random() * 160,
    r: 1.0 + Math.random() * 1.8,
    sp: 0.3 + Math.random() * 0.5,
    alpha: 0.2 + Math.random() * 0.6
  });
}

function anim() {
  T += 0.012;
  cx.clearRect(0, 0, W, H);

  for (let k = 0; k < 3; k++) {
    cx.beginPath();
    const base = H * (0.35 + k * 0.22);
    cx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) {
      const y = base + Math.sin(x * 0.003 + T * 1.2 + k * 1.5) * (18 + k * 5) + Math.cos(x * 0.006 - T * 0.8) * 8;
      cx.lineTo(x, y);
    }
    cx.lineTo(W, H);
    cx.fillStyle = k === 0 ? 'rgba(0, 242, 254, 0.05)' : (k === 1 ? 'rgba(79, 172, 254, 0.04)' : 'rgba(0, 242, 254, 0.02)');
    cx.fill();
    cx.strokeStyle = k === 0 ? 'rgba(0, 242, 254, 0.28)' : 'rgba(79, 172, 254, 0.18)';
    cx.lineWidth = 1.2;
    cx.stroke();
  }

  for (let p of parts) {
    p.y -= p.sp;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    cx.beginPath();
    cx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    cx.fillStyle = `rgba(0, 242, 254, ${p.alpha})`;
    cx.shadowBlur = 8;
    cx.shadowColor = '#00f2fe';
    cx.fill();
    cx.shadowBlur = 0;
  }
  requestAnimationFrame(anim);
}

window.addEventListener('DOMContentLoaded', () => {
  resize();
  anim();
});
</script>
</body>
</html>
