<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ВОЛНА — Мессенджер</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0: #040711;
  --bg1: #080e1a;
  --panel: rgba(13, 22, 38, 0.72);
  --panel2: rgba(20, 32, 56, 0.65);
  --panel3: rgba(28, 45, 78, 0.85);
  --line: rgba(120, 180, 255, 0.12);
  --line2: rgba(140, 210, 255, 0.22);
  --ink: #f1f6fd;
  --mut: #94a5c4;
  --dim: #5c6c8c;
  --acc: #00f2fe;
  --acc2: #4facfe;
  --coral: #ff5e7e;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;border-radius:16px}
body{
  font-family:'Inter', 'Plus Jakarta Sans', -apple-system, sans-serif;
  color:var(--ink);
  background:radial-gradient(ellipse at top, #091326 0%, var(--bg0) 100%);
  -webkit-font-smoothing:antialiased;
  user-select:none;
  border:1px solid rgba(255, 255, 255, 0.1);
  box-shadow: inset 0 0 60px rgba(0, 242, 254, 0.03);
}
button{font-family:inherit;color:inherit;background:none;border:none;outline:none}
input,textarea{font-family:inherit;color:inherit}

/* Ресайз */
.res-handle{position:fixed;z-index:99999}
.res-n{top:0;left:12px;right:12px;height:7px;cursor:n-resize}
.res-s{bottom:0;left:12px;right:12px;height:7px;cursor:s-resize}
.res-e{top:12px;bottom:12px;right:0;width:7px;cursor:e-resize}
.res-w{top:12px;bottom:12px;left:0;width:7px;cursor:w-resize}
.res-nw{top:0;left:0;width:14px;height:14px;cursor:nw-resize}
.res-ne{top:0;right:0;width:14px;height:14px;cursor:ne-resize}
.res-sw{bottom:0;left:0;width:14px;height:14px;cursor:sw-resize}
.res-se{bottom:0;right:0;width:14px;height:14px;cursor:se-resize}

/* Анимированный фон (волны + свечение + частицы) */
#bgfx, #updateBgfx{position:fixed;inset:0;z-index:0;opacity:.95;pointer-events:none}
.glow{position:fixed;border-radius:50%;filter:blur(130px);z-index:0;pointer-events:none}
.g1{
  width:600px;height:600px;left:-150px;top:-180px;
  background:radial-gradient(circle, rgba(0,242,254,.18), transparent 70%);
  animation:auroraDrift1 22s ease-in-out infinite alternate;
}
.g2{
  width:700px;height:700px;right:-220px;bottom:-250px;
  background:radial-gradient(circle, rgba(255,94,126,.14), transparent 70%);
  animation:auroraDrift2 28s ease-in-out infinite alternate-reverse;
}
.g3{
  width:450px;height:450px;left:40%;top:30%;border-radius:50%;
  filter:blur(140px);background:radial-gradient(circle, rgba(79,172,254,.12), transparent 70%);
  animation:auroraDrift3 34s ease-in-out infinite alternate;
}

@keyframes auroraDrift1{
  0%{transform:translate(0,0) scale(1) rotate(0deg)}
  50%{transform:translate(80px,60px) scale(1.18) rotate(45deg)}
  100%{transform:translate(30px,110px) scale(0.92) rotate(90deg)}
}
@keyframes auroraDrift2{
  0%{transform:translate(0,0) scale(1) rotate(0deg)}
  50%{transform:translate(-90px,-70px) scale(1.15) rotate(-40deg)}
  100%{transform:translate(-40px,-120px) scale(0.9) rotate(-80deg)}
}
@keyframes auroraDrift3{
  0%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-30%,-40%) scale(1.3)}
  100%{transform:translate(-60%,-60%) scale(0.85)}
}

.app{position:relative;z-index:2;display:flex;height:100vh;flex-direction:column}

/* Шапка */
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
  background:rgba(8, 14, 26, 0.78);
  backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{
  font-family:'Unbounded';font-weight:900;font-size:20px;letter-spacing:.08em;
  background:linear-gradient(135deg, #ffffff 0%, var(--acc) 50%, var(--acc2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
}
.conn-status{
  display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono';font-size:11.5px;
  color:var(--mut);background:rgba(255,255,255,0.03);padding:4px 10px;
  border-radius:20px;border:1px solid rgba(255,255,255,0.05);
}
.dot{
  width:8px;height:8px;border-radius:50%;background:var(--coral);
  box-shadow:0 0 10px var(--coral);transition:all .4s ease;
}
.dot.online{background:var(--acc);box-shadow:0 0 14px var(--acc), 0 0 3px #fff}

.topbar-right{display:flex;align-items:center;gap:18px}
.user-block{display:flex;align-items:center;gap:10px}
.nick-label{font-size:12.5px;color:var(--mut);font-weight:600}
.nick-input{
  background:var(--panel2);border:1px solid var(--line2);border-radius:12px;
  padding:6px 14px;font-size:13.5px;font-weight:700;color:var(--acc);outline:none;
}
.win-ctrls{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line2);padding-left:16px}
.wbtn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--mut);font-size:14px;transition:all .25s ease;background:var(--panel);
  border:1px solid var(--line);
}
.wbtn:hover{color:#fff;background:var(--panel3);border-color:var(--acc2);transform:translateY(-2px)}
.wbtn.close:hover{background:var(--coral);color:#fff;border-color:var(--coral)}

/* Чат */
.chat-viewport{flex:1;position:relative;display:flex;overflow:hidden}
.msgs{
  flex:1;overflow-y:overlay;overflow-x:hidden;
  padding:28px 24px;display:flex;flex-direction:column;gap:16px;
  scroll-behavior:smooth;
}

/* Форма сообщений */
.msg-wrap{position:relative;display:flex;flex-direction:column;max-width:min(700px,82%);transform-origin: bottom center}
.msg-wrap.me{align-self:flex-end;align-items:flex-end}
.msg-wrap.them{align-self:flex-start;align-items:flex-start}

.bubble{
  padding:12px 18px;font-size:14.5px;line-height:1.55;position:relative;word-break:break-word;
  user-select:text;
}
.msg-wrap.them .bubble{
  background:linear-gradient(135deg, rgba(20,33,56,0.85) 0%, rgba(12,20,36,0.9) 100%);
  border:1px solid var(--line);
  border-radius:20px 20px 20px 6px;
  color:var(--ink);backdrop-filter:blur(14px);
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
.msg-wrap.me .bubble{
  background:linear-gradient(135deg, rgba(0,168,179,0.8) 0%, rgba(13,66,99,0.9) 100%);
  border:1px solid rgba(0, 242, 254, 0.45);
  color:#f2fcfe;
  border-radius:20px 20px 6px 20px;
  box-shadow:0 8px 25px rgba(0,0,0,0.4), 0 0 20px rgba(0,242,254,0.18);
  backdrop-filter:blur(14px);
}

.sender-name{
  font-size:12px;font-weight:800;margin-bottom:6px;
  background:linear-gradient(90deg, var(--acc2), var(--acc));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.meta-time{font-family:'JetBrains Mono';font-size:10.5px;opacity:.65;margin-top:6px;float:right;margin-left:14px}

.tg-media{
  margin-top:6px;border-radius:16px;overflow:hidden;max-width:440px;
  background:rgba(0,0,0,.35);border:1px solid var(--line2);
}
.tg-media img{display:block;max-width:100%;max-height:400px;object-fit:contain;border-radius:14px;cursor:pointer}
.tg-media video{display:block;max-width:100%;max-height:400px;border-radius:14px}

.file-card{
  display:flex;flex-direction:column;gap:10px;background:rgba(9, 17, 32, 0.7);
  border:1px solid var(--line2);padding:12px 16px;border-radius:16px;margin-top:8px;
}
.file-row{display:flex;align-items:center;gap:12px}
.file-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.fbtn{
  font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;
  background:rgba(120,180,255,.14);cursor:pointer;border:1px solid rgba(120,180,255,.2);
}
.fbtn:hover{background:linear-gradient(135deg, var(--acc), var(--acc2));color:#041a1a}

/* Кнопки в стиле Реакций */
.rpill{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 16px;
  border-radius:99px;background:rgba(12, 22, 38, 0.7);border:1px solid var(--line2);
  transition:all .25s cubic-bezier(0.34, 1.56, 0.64, 1);cursor:pointer;
  backdrop-filter:blur(10px);color:var(--mut);
}
.rpill:hover{transform:scale(1.06) translateY(-2px);background:rgba(25, 42, 70, 0.85);color:#fff}
.rpill.mine{
  border-color:var(--acc);background:rgba(0,242,254,.22);
  box-shadow:0 0 16px rgba(0,242,254,.4);color:#fff;
}

/* Композер */
.composer-wrap{padding:16px 28px 24px}
.composer{
  display:flex;align-items:center;gap:12px;background:rgba(15, 25, 45, 0.75);
  border:1px solid var(--line2);border-radius:20px;padding:8px 16px;
}
#mtext{flex:1;background:none;border:none;outline:none;font-size:15px;color:var(--ink);resize:none;max-height:110px}
.send-btn{
  width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg, var(--acc) 0%, var(--acc2) 100%);
  color:#031818;display:grid;place-items:center;cursor:pointer;transition:all .25s ease;
}
.send-btn:hover{transform:scale(1.1);box-shadow:0 0 20px rgba(0,242,254,.6)}

/* =======================================================
   1) ВСПЛЫВАЮЩИЙ ТОСТ В ТОЧНОМ СТИЛЕ СООБЩЕНИЯ СОБЕСЕДНИКА
   ======================================================= */
.tray-toast-container{
  position:fixed;right:24px;bottom:24px;z-index:9999;
  display:flex;flex-direction:column;gap:12px;pointer-events:none;
}
.incoming-toast{
  pointer-events:auto;
  cursor:pointer;
  animation:toastPop .35s cubic-bezier(.175,.885,.32,1.275) forwards;
  max-width:380px;min-width:280px;
  filter:drop-shadow(0 15px 30px rgba(0,0,0,0.8)) drop-shadow(0 0 20px rgba(0,242,254,0.3));
  position:relative;
}
.incoming-toast .bubble{
  background:linear-gradient(135deg, rgba(20,33,56,0.95) 0%, rgba(12,20,36,0.98) 100%);
  border:1.5px solid var(--acc);
  border-radius:20px 20px 20px 6px;
  box-shadow:0 0 25px rgba(0, 242, 254, 0.25);
  padding:14px 18px;
}
.incoming-toast .toast-close{
  position:absolute;top:10px;right:14px;color:var(--dim);font-size:13px;
  cursor:pointer;transition:color .2s ease;
}
.incoming-toast .toast-close:hover{color:var(--coral)}
@keyframes toastPop{
  0%{opacity:0;transform:translateY(40px) scale(0.85)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* =======================================================
   2) ОКНО ОБНОВЛЕНИЯ (ВОЛНЫ + СВЕЧЕНИЕ + КНОПКИ РЕАКЦИЙ)
   ======================================================= */
#updateModalOverlay{
  position:fixed;inset:0;z-index:10000;display:none;place-items:center;
  background:rgba(4, 7, 17, 0.88);backdrop-filter:blur(24px);
}
#updateModalOverlay.active{display:grid}
.update-card{
  position:relative;z-index:2;
  background:rgba(13, 22, 38, 0.82);
  border:1.5px solid var(--acc);
  border-radius:24px;padding:34px 44px;
  box-shadow:0 20px 60px rgba(0,0,0,0.9), 0 0 40px rgba(0, 242, 254, 0.35);
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px;
  animation:modalSpring .4s cubic-bezier(.175,.885,.32,1.275) forwards;
}
@keyframes modalSpring{
  0%{transform:scale(0.8);opacity:0}
  100%{transform:scale(1);opacity:1}
}
.update-card h2{
  font-family:'Unbounded';font-weight:900;font-size:18px;letter-spacing:.06em;
  background:linear-gradient(135deg, #ffffff 0%, var(--acc) 60%, var(--acc2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 25px rgba(0, 242, 254, 0.5);
}
.update-btns{
  display:flex;align-items:center;gap:18px;justify-content:center;
}
.update-btns .rpill{
  padding:10px 24px;font-size:14.5px;font-weight:700;
}
</style>
<style id="custom-cursors-style"></style>
</head>
<body>

<canvas id="bgfx"></canvas>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="glow g3"></div>

<!-- Оверлей обновления с частицами, волнами и кнопками реакций -->
<div id="updateModalOverlay">
  <div class="update-card">
    <h2>ВОЛНА • ОБНОВЛЕНИЕ ГОТОВО</h2>
    <div class="update-btns">
      <button class="rpill mine" onclick="callPy('py_apply_update')">✨ Установить сейчас</button>
      <button class="rpill" onclick="dismissUpdateModal()">Позже</button>
    </div>
  </div>
</div>

<!-- Контейнер всплывающих облачков в стиле сообщений собеседника -->
<div class="tray-toast-container" id="toastContainer"></div>

<div class="app">
  <header class="topbar" onmousedown="onTopBarMouseDown(event)">
    <div class="brand">
      <h1>ВОЛНА</h1>
      <div class="conn-status">
        <span class="dot" id="connDot"></span>
        <span id="connTxt">Поиск сервера...</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="user-block">
        <span class="nick-label">Никнейм:</span>
        <input type="text" id="nickInput" class="nick-input" maxlength="24">
      </div>
      <div class="win-ctrls">
        <button class="wbtn" onclick="callPy('py_minimize_window')" title="Свернуть">—</button>
        <button class="wbtn close" onclick="callPy('py_hide_window')" title="Скрыть в трей">✕</button>
      </div>
    </div>
  </header>

  <div class="chat-viewport">
    <main class="msgs" id="msgsBox"></main>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <button class="wbtn" onclick="callPy('py_select_and_send_file')" title="Прикрепить">📁</button>
      <textarea id="mtext" rows="1" placeholder="Напишите сообщение..."></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
let myNickname = "User";
const messagesMap = new Map();
const localReadyFiles = new Map();
const msgsBox = document.getElementById('msgsBox');

function callPy(funcName, ...args) {
  if (window.pywebview && window.pywebview.api && window.pywebview.api[funcName]) {
    return window.pywebview.api[funcName](...args);
  }
  return Promise.resolve(null);
}

// 1. Показ модалки обновления в неоновом стиле ВОЛНЫ
window.js_show_update_modal = function() {
  document.getElementById('updateModalOverlay').classList.add('active');
};
function dismissUpdateModal() {
  document.getElementById('updateModalOverlay').classList.remove('active');
  callPy('py_dismiss_update');
}

// 2. Всплывающее уведомление в точном стиле входящего сообщения собеседника
window.js_show_incoming_toast = function(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'incoming-toast';

  const isFile = msg.action === 'file' || msg.filename;
  let bodyContent = '';

  if (isFile) {
    const fn = (msg.filename || 'Файл').toLowerCase();
    const isImg = /\.(jpg|jpeg|png|gif|webp)$/.test(fn);
    if (isImg && msg.content_url) {
      bodyContent = `<div class="tg-media"><img src="${msg.content_url}"/></div>`;
    } else {
      bodyContent = `
        <div class="file-card">
          <div class="file-row">
            <span style="font-size:22px">📄</span>
            <span class="file-name">${escapeHtml(msg.filename || 'Файл')}</span>
          </div>
        </div>`;
    }
  } else {
    bodyContent = `<span>${escapeHtml(msg.text || '')}</span>`;
  }

  toast.innerHTML = `
    <div class="bubble">
      <span class="toast-close" onclick="event.stopPropagation(); this.closest('.incoming-toast').remove()">✕</span>
      <div class="sender-name">${escapeHtml(msg.sender || 'Собеседник')}</div>
      ${bodyContent}
      <span class="meta-time">${msg.time || ''}</span>
    </div>
  `;

  toast.onclick = () => {
    callPy('py_restore_from_toast');
    toast.remove();
  };

  container.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 6500);
};

// --- Перемещение окна за шапку ---
let isWindowMoving = false, moveStartX = 0, moveStartY = 0, winStartX = 0, winStartY = 0, rafPending = false;
function onTopBarMouseDown(e) {
  if (e.button !== 0 || e.target.closest('button, input, textarea, a, .wbtn, .nick-input, .win-ctrls')) return;
  isWindowMoving = true;
  moveStartX = e.screenX; moveStartY = e.screenY;
  callPy('py_get_window_bounds').then(b => { if (b) { winStartX = b.x; winStartY = b.y; } });
}
window.addEventListener('mousemove', (e) => {
  if (isWindowMoving) {
    const dx = e.screenX - moveStartX, dy = e.screenY - moveStartY;
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(() => {
        callPy('py_move_window', winStartX + dx, winStartY + dy);
        rafPending = false;
      });
    }
  }
});
window.addEventListener('mouseup', () => { isWindowMoving = false; });

window.addEventListener('pywebviewready', async () => {
  const state = await callPy('py_frontend_ready');
  if (state) {
    myNickname = state.nickname;
    document.getElementById('nickInput').value = myNickname;
    window.js_set_connection_status(state.connected);
    if (state.history) window.js_load_history(state.history);
  }
});

document.getElementById('nickInput').addEventListener('change', (e) => {
  myNickname = e.target.value.trim() || "User";
  callPy('py_set_nickname', myNickname);
});

const mtext = document.getElementById('mtext');
mtext.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
function sendMessage() {
  const t = mtext.value.trim();
  if (!t) return;
  callPy('py_send_text', t);
  mtext.value = '';
}

window.js_set_connection_status = function(online) {
  document.getElementById('connDot').classList.toggle('online', online);
  document.getElementById('connTxt').textContent = online ? 'В сети' : 'Поиск сервера...';
};

window.js_load_history = function(history) {
  msgsBox.innerHTML = '';
  history.forEach(m => msgsBox.appendChild(createMessageElement(m)));
  msgsBox.scrollTop = msgsBox.scrollHeight;
};

window.js_add_message = function(msg) {
  msgsBox.appendChild(createMessageElement(msg));
  msgsBox.scrollTop = msgsBox.scrollHeight;
};

window.js_on_file_ready = function(fileId, filename, localPath, relUrl) {
  localReadyFiles.set(fileId, { localPath, relUrl });
  const mediaWrap = document.getElementById(`media-${fileId}`);
  if (mediaWrap) {
    mediaWrap.innerHTML = `<img src="${relUrl}" onclick="callPy('py_open_file', '${localPath}')"/>`;
  }
};

function createMessageElement(m) {
  const msgId = m.id || m.file_id;
  const isMe = (m.sender === myNickname);
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${isMe ? 'me' : 'them'}`;

  let inner = '';
  if (m.action === 'file' || m.filename) {
    const fileId = m.file_id || msgId;
    const fileData = localReadyFiles.get(fileId);
    inner = `<div class="tg-media" id="media-${fileId}">${fileData ? `<img src="${fileData.relUrl}"/>` : '⏳ Загрузка...'}</div>`;
  } else {
    inner = `<span>${escapeHtml(m.text || '')}</span>`;
  }

  wrap.innerHTML = `
    <div class="bubble">
      ${!isMe ? `<div class="sender-name">${escapeHtml(m.sender || 'Аноним')}</div>` : ''}
      ${inner}
      <span class="meta-time">${m.time || ''}</span>
    </div>
  `;
  return wrap;
}

function escapeHtml(s) {
  return (s || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Canvas фон: 3 биоморфные волны и поднимающиеся светящиеся частицы
const cv = document.getElementById('bgfx'), cx = cv.getContext('2d');
let W, H, parts = [], T = 0;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
resize(); window.addEventListener('resize', resize);

for (let i = 0; i < 65; i++) {
  parts.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: 1.0 + Math.random() * 2.0, sp: 0.3 + Math.random() * 0.6,
    alpha: 0.2 + Math.random() * 0.6
  });
}

function anim() {
  T += 0.01;
  cx.clearRect(0, 0, W, H);

  // 3 волны
  for (let k = 0; k < 3; k++) {
    cx.beginPath();
    const base = H * (0.35 + k * 0.22);
    cx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) {
      const y = base + Math.sin(x * 0.0025 + T * 1.2 + k * 1.5) * (28 + k * 8) + Math.cos(x * 0.005 - T * 0.8) * 14;
      cx.lineTo(x, y);
    }
    cx.lineTo(W, H);
    cx.fillStyle = k === 0 ? 'rgba(0, 242, 254, 0.04)' : (k === 1 ? 'rgba(79, 172, 254, 0.03)' : 'rgba(255, 94, 126, 0.02)');
    cx.fill();
    cx.strokeStyle = k === 0 ? 'rgba(0, 242, 254, 0.22)' : 'rgba(79, 172, 254, 0.15)';
    cx.stroke();
  }

  // Поднимающиеся светящиеся точки
  for (let p of parts) {
    p.y -= p.sp;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    cx.beginPath();
    cx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    cx.fillStyle = `rgba(0, 242, 254, ${p.alpha})`;
    cx.shadowBlur = 8;
    cx.shadowColor = '#00f2fe';
    cx.fill();
    cx.shadowBlur = 0;
  }
  requestAnimationFrame(anim);
}
anim();
</script>
