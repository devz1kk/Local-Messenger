<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #040914;
  --cyan-neon: #00f2fe;
  --cyan-glow: #4facfe;
  --ink: #f1f6fd;
  --coral: #ff5e7e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #040914 !important;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  user-select: none;
  color: var(--ink);
}

.toast-bubble {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #0a1932 0%, #040914 100%);
  border: 2px solid var(--cyan-neon);
  border-radius: 20px;
  color: var(--ink);
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  box-shadow: 
    inset 0 0 16px rgba(0, 242, 254, 0.45),
    inset 0 0 32px rgba(0, 242, 254, 0.2);
  overflow: hidden;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sender-name {
  font-size: 13px;
  font-weight: 800;
  background: linear-gradient(90deg, #ffffff, var(--cyan-neon));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 0.03em;
  text-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
}

.btn-close {
  color: #6a82a8;
  font-size: 14px;
  padding: 2px 6px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .2s ease;
}
.btn-close:hover {
  color: var(--coral);
  background: rgba(255, 94, 126, 0.2);
}

.msg-body {
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--ink);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  margin: 4px 0;
}

.tg-media {
  display: none;
  border-radius: 10px;
  overflow: hidden;
  max-height: 50px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(0, 242, 254, 0.4);
  margin: 2px 0;
}
.tg-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.file-card {
  display: none;
  align-items: center;
  gap: 8px;
  background: rgba(10, 20, 38, 0.9);
  border: 1px solid rgba(0, 242, 254, 0.35);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin: 2px 0;
}

.footer-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.meta-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--cyan-glow);
  opacity: 0.9;
}
</style>
</head>
<body>

<div class="toast-bubble" onclick="onToastClick()">
  <div class="header-row">
    <span class="sender-name" id="senderNick">ВОЛНА</span>
    <span class="btn-close" onclick="event.stopPropagation(); onClose();">✕</span>
  </div>
  
  <div class="msg-body" id="msgText">Загрузка сообщения...</div>

  <div class="tg-media" id="mediaBox">
    <img id="mediaImg" src="" alt="Медиа"/>
  </div>

  <div class="file-card" id="fileBox">
    <span style="font-size: 14px;">📄</span>
    <span id="fileName" style="overflow:hidden;text-overflow:ellipsis;">Файл</span>
  </div>

  <div class="footer-row">
    <span class="meta-time" id="msgTime">12:00</span>
  </div>
</div>

<script>
function callPy(fn, ...args) {
  if (window.pywebview && window.pywebview.api && window.pywebview.api[fn]) {
    window.pywebview.api[fn](...args);
  }
}

function setToastPayload(data) {
  if (!data) return;
  document.getElementById('senderNick').textContent = data.sender || 'ВОЛНА';
  document.getElementById('msgTime').textContent = data.time || '';
  
  const textEl = document.getElementById('msgText');
  const mediaBox = document.getElementById('mediaBox');
  const mediaImg = document.getElementById('mediaImg');
  const fileBox = document.getElementById('fileBox');
  const fileName = document.getElementById('fileName');

  textEl.style.display = 'none';
  mediaBox.style.display = 'none';
  fileBox.style.display = 'none';

  if (data.action === 'file' || data.filename) {
    const fn = (data.filename || '').toLowerCase();
    const isImg = /\.(jpg|jpeg|png|gif|webp)$/.test(fn);
    if (isImg && data.content_url) {
      mediaImg.src = data.content_url;
      mediaBox.style.display = 'block';
    } else {
      fileName.textContent = data.filename || 'Документ';
      fileBox.style.display = 'flex';
    }
  } else {
    textEl.textContent = data.text || '';
    textEl.style.display = '-webkit-box';
  }
}

function onToastClick() {
  callPy('py_on_toast_clicked');
}

function onClose() {
  callPy('py_on_toast_close');
}

window.addEventListener('pywebviewready', () => {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.py_get_toast_payload) {
    window.pywebview.api.py_get_toast_payload().then(data => {
      if (data) setToastPayload(data);
    });
  }
});
</script>
</body>
</html>
