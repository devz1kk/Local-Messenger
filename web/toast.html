<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #040711;
  --line-acc: rgba(0, 242, 254, 0.55);
  --ink: #f1f6fd;
  --mut: #94a5c4;
  --acc: #00f2fe;
  --acc2: #4facfe;
  --coral: #ff5e7e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: transparent;
  font-family: 'Inter', sans-serif;
  user-select: none;
}

/* Форма входящего сообщения без внешних прямоугольных рамок */
.toast-bubble {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, rgba(20, 33, 56, 0.98) 0%, rgba(10, 18, 32, 1) 100%);
  border: 1.5px solid var(--line-acc);
  border-radius: 20px 20px 20px 6px;
  color: var(--ink);
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.12);
  overflow: hidden;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sender-name {
  font-size: 12.5px;
  font-weight: 800;
  background: linear-gradient(90deg, var(--acc2), var(--acc));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 0.02em;
}
.btn-close {
  color: #5c6c8c;
  font-size: 13px;
  padding: 1px 5px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .2s ease;
}
.btn-close:hover {
  color: var(--coral);
  background: rgba(255, 94, 126, 0.2);
}

.msg-body {
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--ink);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  margin: 4px 0;
}

.tg-media {
  display: none;
  border-radius: 10px;
  overflow: hidden;
  max-height: 52px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(0,242,254,0.3);
  margin: 2px 0;
}
.tg-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.file-card {
  display: none;
  align-items: center;
  gap: 8px;
  background: rgba(9, 17, 32, 0.8);
  border: 1px solid rgba(120, 180, 255, 0.2);
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin: 2px 0;
}

.footer-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
}
.meta-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  opacity: 0.65;
}
</style>
</head>
<body>

<div class="toast-bubble" onclick="onToastClick()">
  <div class="header-row">
    <span class="sender-name" id="senderNick">Собеседник</span>
    <span class="btn-close" onclick="event.stopPropagation(); onClose();">✕</span>
  </div>
  
  <div class="msg-body" id="msgText"></div>

  <div class="tg-media" id="mediaBox">
    <img id="mediaImg" src="" alt="Медиа"/>
  </div>

  <div class="file-card" id="fileBox">
    <span style="font-size: 14px;">📄</span>
    <span id="fileName" style="overflow:hidden;text-overflow:ellipsis;">Документ</span>
  </div>

  <div class="footer-row">
    <span class="meta-time" id="msgTime">12:00</span>
  </div>
</div>

<script>
function callPy(fn, ...args) {
  if (window.pywebview && window.pywebview.api && window.pywebview.api[fn]) {
    window.pywebview.api[fn](...args);
  }
}

function setToastPayload(data) {
  document.getElementById('senderNick').textContent = data.sender || 'Собеседник';
  document.getElementById('msgTime').textContent = data.time || '';
  
  const textEl = document.getElementById('msgText');
  const mediaBox = document.getElementById('mediaBox');
  const mediaImg = document.getElementById('mediaImg');
  const fileBox = document.getElementById('fileBox');
  const fileName = document.getElementById('fileName');

  textEl.style.display = 'none';
  mediaBox.style.display = 'none';
  fileBox.style.display = 'none';

  if (data.action === 'file' || data.filename) {
    const fn = (data.filename || '').toLowerCase();
    const isImg = /\.(jpg|jpeg|png|gif|webp)$/.test(fn);
    if (isImg && data.content_url) {
      mediaImg.src = data.content_url;
      mediaBox.style.display = 'block';
    } else {
      fileName.textContent = data.filename || 'Файл';
      fileBox.style.display = 'flex';
    }
  } else {
    textEl.textContent = data.text || '';
    textEl.style.display = '-webkit-box';
  }
}

function onToastClick() {
  callPy('py_on_toast_clicked');
}

function onClose() {
  callPy('py_on_toast_close');
}

window.addEventListener('pywebviewready', () => {
  callPy('py_toast_ready');
});
</script>
</body>
</html>
